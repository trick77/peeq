name: CI

# Tests run on pull requests (feature branches). Master does not run tests — it
# builds and pushes the image (see release.yaml). No image build happens here.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      # The race detector needs cgo; this is independent of the app's
      # CGO_ENABLED=0 build invariant enforced by the `go build` step above.
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  ui:
    name: UI (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  extension:
    name: Extension (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test
      # The committed Netscape fixture is generated from shared.js and asserted
      # by a Go test. Nothing links them at compile time, so a serializer change
      # with a forgotten regeneration would leave the Go test passing against a
      # stale-but-valid fixture — exactly the drift this phase exists to
      # prevent. Fail loudly instead.
      - name: Fixture is up to date with the serializer
        run: |
          node testdata/generate_fixture.js > /tmp/fixture-fresh.txt
          diff -u ../backend/internal/cookie/testdata/extension_output.txt /tmp/fixture-fresh.txt \
            || { echo "::error::extension_output.txt is stale. Regenerate with: cd extension && node testdata/generate_fixture.js > ../backend/internal/cookie/testdata/extension_output.txt"; exit 1; }

      # Package on every PR too, not only on release: it exercises the same
      # script the release uses (so packaging can't break unnoticed between
      # releases) and gives a loadable build to test without a checkout.
      # 0.0.<run_number> is a throwaway numeric version — the real one is
      # stamped by the release workflow.
      - name: Package extension
        run: ./package.sh "0.0.${{ github.run_number }}" /tmp/peeq-companion.zip

      - uses: actions/upload-artifact@v4
        with:
          name: peeq-companion-extension
          path: /tmp/peeq-companion.zip
          if-no-files-found: error
