name: CI

# Tests run on pull requests (feature branches). Master does not run tests — it
# builds and pushes the image (see release.yaml). No image build happens here.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: mkdir -p ../coverage
      # The race detector needs cgo; this is independent of the app's
      # CGO_ENABLED=0 build invariant enforced by the `go build` step above.
      #
      # -coverpkg=./... attributes coverage across package boundaries: code
      # exercised only by another package's tests (the httpapi tests drive
      # store, videos and llm) is otherwise reported as uncovered.
      - run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=../coverage/backend.out ./...
        env:
          CGO_ENABLED: "1"
      # Go exposes no line metric — `go tool cover` reports statements only — so
      # the line percentage comes from a Cobertura conversion of the profile.
      # That also merges the duplicate blocks -coverpkg emits, one set per test
      # binary, which a naive sum over the raw profile gets badly wrong.
      - run: go run github.com/boumenot/gocover-cobertura@v1.5.0 < ../coverage/backend.out > ../coverage/backend.xml
      # The gate resolves paths from the repo root, not backend/.
      - run: ./hack/coverage-gate.sh backend
        working-directory: .

  ui:
    name: UI (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run --coverage
      - run: ./hack/coverage-gate.sh ui
        working-directory: .

  extension:
    name: Extension (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test
      # The committed Netscape fixture is generated from shared.js and asserted
      # by a Go test. Nothing links them at compile time, so a serializer change
      # with a forgotten regeneration would leave the Go test passing against a
      # stale-but-valid fixture — exactly the drift this phase exists to
      # prevent. Fail loudly instead.
      - name: Fixture is up to date with the serializer
        run: |
          node testdata/generate_fixture.js > /tmp/fixture-fresh.txt
          diff -u ../backend/internal/cookie/testdata/extension_output.txt /tmp/fixture-fresh.txt \
            || { echo "::error::extension_output.txt is stale. Regenerate with: cd extension && node testdata/generate_fixture.js > ../backend/internal/cookie/testdata/extension_output.txt"; exit 1; }

      # Package on every PR too, not only on release: it exercises the same
      # script the release uses (so packaging can't break unnoticed between
      # releases) and gives a loadable build to test without a checkout.
      # 0.0.<run_number> is a throwaway numeric version — the real one is
      # stamped by the release workflow.
      - name: Package extension
        run: ./package.sh "0.0.${{ github.run_number }}" /tmp/peeq-companion.zip

      - uses: actions/upload-artifact@v7
        with:
          name: peeq-companion-extension
          path: /tmp/peeq-companion.zip
          if-no-files-found: error

  # Browser-level tests. Separate job because it needs Playwright and a real
  # Chromium download, which the extension's own zero-dependency package
  # deliberately does not carry. It covers the one seam no unit test can reach:
  # how Chrome's permission model filters the cookies the extension can see.
  extension-e2e:
    name: Extension (browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
