name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: ver
        name: Compute next version
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          LATEST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          LATEST="${LATEST:-0.0.0}"
          IFS=. read -r MA MI PA <<< "$LATEST"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="$MA.$MI.$PA"
          SHORT=$(git rev-parse --short HEAD)
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "major=$MA"     >> "$GITHUB_OUTPUT"
          echo "minor=$MI"     >> "$GITHUB_OUTPUT"
          echo "short=$SHORT"  >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST -> $NEXT ($BUMP) at $SHORT" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Containerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BACKEND_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.major }}.${{ steps.ver.outputs.minor }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.major }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.short }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag only AFTER the image push succeeds, so a failed release never leaves
      # an orphan git tag behind.
      #
      # Create the tag via the REST API rather than `git push`. A git-transport tag push with
      # GITHUB_TOKEN is refused once the repo contains workflow files (it needs the `workflows`
      # scope, which is not grantable via the `permissions:` block); create-ref only adds a
      # pointer to the existing commit and is allowed under `contents: write`.
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ steps.ver.outputs.version }}" \
            -f sha="${{ github.sha }}"

      # The browser extension is not distributed via the Chrome Web Store — it
      # talks to one self-hosted server and needs no discovery or auto-update —
      # so the release asset is how a user gets a loadable build. The release
      # version is stamped into the manifest by package.sh, so a downloaded zip
      # always reports the release it came from.
      - name: Package extension
        run: ./extension/package.sh "${{ steps.ver.outputs.version }}" "peeq-companion-${{ steps.ver.outputs.version }}.zip"

      # Runs after the tag exists, so the release attaches to it rather than
      # creating a second pointer at the same commit.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          cat > /tmp/release-notes.md <<NOTES
          Container image: \`ghcr.io/${{ github.repository }}:$VERSION\`

          **peeq Companion** browser extension — download \`peeq-companion-$VERSION.zip\`,
          unzip it, then load the unzipped folder at \`chrome://extensions\` with Developer
          mode enabled.

          Install it in a dedicated Chrome profile signed into a dedicated YouTube account,
          and never browse YouTube in that profile — YouTube rotates account cookies on open
          YouTube tabs, which is what kills an exported cookie. See the README.
          NOTES
          # The heredoc is indented to stay inside this block scalar; strip that
          # indentation back out before the notes are published.
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "$VERSION" \
            "peeq-companion-$VERSION.zip" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md
