# Local development: single embedded binary, dev auth (no OIDC), host
# networking.
#
#   docker compose -f compose.dev.yaml up --build --remove-orphans  # UI on http://localhost:8080
#   docker compose -f compose.dev.yaml down
#
# Auto-signs in as a fixed "dev" admin user (see internal/config's Dev
# block). The dev-auth guard requires a loopback BACKEND_ADDR, which is why
# this uses network_mode: host instead of published ports (a 127.0.0.1
# bind inside a bridge-network container is unreachable via -p).
services:
  # Pre-creates ./data with the right ownership for the container's non-root
  # uid:gid (matches the "user: 1000:1000" set on peeq below).
  peeq-init:
    image: alpine
    command: chown -R 1000:1000 /data
    volumes:
      - ./data:/data

  peeq:
    build:
      context: .
      dockerfile: backend/Containerfile
    network_mode: host
    user: "1000:1000"
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      BACKEND_AUTH_MODE: dev
      BACKEND_ADDR: "127.0.0.1:8080"
      BACKEND_PUBLIC_URL: "http://localhost:8080"
      BACKEND_SESSION_SECRET: dev-secret-please-change
      BACKEND_DB_PATH: /data/peeq.db
      BACKEND_MEDIA_DIR: /data/media
      BACKEND_YTDLP_DIR: /data/bin
      # AI endpoints. Unlike the rest of this file these can't be hardcoded —
      # they point at real endpoints — so the dev stack needs a populated .env.
      BACKEND_CHAT_BASE_URL: "${BACKEND_CHAT_BASE_URL}"
      BACKEND_CHAT_API_KEY: "${BACKEND_CHAT_API_KEY}"
      BACKEND_EMBED_BASE_URL: "${BACKEND_EMBED_BASE_URL}"
      BACKEND_EMBED_API_KEY: "${BACKEND_EMBED_API_KEY}"
      BACKEND_EMBED_MODEL: "${BACKEND_EMBED_MODEL}"
      BACKEND_EMBED_DIM: "${BACKEND_EMBED_DIM:-1536}"
      BACKEND_DEFAULT_SUB_LANG: "${BACKEND_DEFAULT_SUB_LANG:-en}"
      BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-debug}"
    volumes:
      - ./data:/data
      - peeq-dev-tmp:/tmp
    depends_on:
      peeq-init:
        condition: service_completed_successfully

volumes:
  peeq-dev-tmp:
