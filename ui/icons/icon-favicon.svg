<!--
  Source for public/icon.svg — the browser tab icon, and nothing else.
  hack/gen-icons.sh ships it as-is; no raster is rendered from it.

  It is a copy of icon.svg beside it with ONE change: the frame's rect carries a
  fill. The geometry, the gradient, the 2.5 stroke, the filled wedge and the 96%
  coverage are all that file's and are documented there.

  WHY THIS EXISTS AS ITS OWN SOURCE. icon.svg still renders icon-192 and
  icon-512, and those stay transparent. The tab icon has the opposite need, so
  the two cannot share a file — the same reason icon-tile.svg and
  icon-maskable.svg are already separate.

  WHY IT HAS A GROUND, given that this file's history is two reversals of
  exactly that. The reasons for the reversals are still in icon.svg and are not
  deleted here. What is new is a measurement they were missing: Safari draws
  favicons on a LIGHT PLATE in its favourites and bookmarks bars — rgb(192,192,192)
  across the whole 16x16 square, on a bar that is rgb(29,29,28) in dark
  appearance. That is a surface the earlier passes never looked at, and on it a
  transparent mark is an orange scribble on a white card.

  The old note about "pale notches" at the corners was measuring something else:
  a transparent corner takes the tab's own colour, so on a LIGHT tab bar it is
  light. That is what transparency does, not a plate. A rounded chip with
  visible corners is the shape YouTube's favicon ships (measured: transparent
  canvas, opaque rounded rect) and it reads fine.

  ONLY THE FRAME'S INTERIOR IS FILLED, so what lands in a tab is a rounded chip
  rather than a square tile — which is the thing this file reverted twice, and
  is still not what it does. Coverage stays at 96%.

  #33322f, not the #1f1f1e the two tiled sources use: at 16px #1f1f1e (L* 11.7)
  reads as a black square, which is the look this is meant to avoid. #33322f
  (L* 20.8) still reads as peeq's own dark and leaves the gradient stroke
  (#e08a68 -> #c25f34) its contrast. Change it and gen-icons.sh's ground
  assertion has to move with it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <g transform="translate(-3.965 -3.965) scale(2.9971)" fill="none" stroke="url(#og)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2" fill="#33322f"/>
    <path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z" fill="url(#og)" stroke="none"/>
  </g>
</svg>
