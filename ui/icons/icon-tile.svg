<!--
  Source for apple-touch-icon.png only. Not shipped: ui/icons/ is outside
  Vite's publicDir, so nothing here is copied into the bundle.

  Two things iOS forces that the transparent icon.svg cannot give it:

  1. An opaque ground. iOS composites an apple-touch-icon onto PURE BLACK before
     masking it, so a transparent one ships as a black square. #1f1f1e is peeq's
     own color-bg token, which is what that flattening should have produced.
  2. Square corners. iOS applies its own superellipse mask; rounding the corners
     of the TILE would double-round them. The chip inside keeps its rx 4 — those
     corners are the mark's own and are meant to be seen.

  The chip is smaller than in icon.svg (60% vs 100%) because it now sits inside
  a tile with its own edges to breathe against, rather than being the whole
  picture. This puts one rounded shape inside another, which is intended.

  The wedge is painted the tile's own #1f1f1e, so it reads as cut clean through
  the chip to the tile behind it. Same lucide square-play paths, same filled
  chip, same 1.35 wedge scale and the same true-bbox centring as icon.svg — see
  that file for all of it, for why the nominal 24x24 box is not used, and for
  the two derived transform formulas. This file's coverage C is 0.60.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect width="64" height="64" fill="#1f1f1e"/>
  <g transform="translate(6.4000 6.4000) scale(2.13333)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(-4.2 -4.2) scale(1.35)" fill="#1f1f1e">
      <path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/>
    </g>
  </g>
</svg>
