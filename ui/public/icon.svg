<!--
  Peeq's icon: lucide's "square-play" — a play wedge inside a rounded frame.
  A triangle alone at 16px is a shape with no outline to hold it; the frame
  gives it one. The rail used to keep that bare triangle and leave this to the
  tab, which made the app and its own favicon two different marks. It no
  longer does: the rail's PeeqMark (ui/src/shell/Rail.tsx) copies the geometry
  below, dropping the two things that exist only for browser chrome — the
  opaque ground and the literal hex. A change here wants a look at that one.

  The paths are lucide's (ISC), copied rather than imported — nothing loads
  lucide-react to draw a static asset. Two departures from how lucide itself
  would render them:

  1. The wedge is FILLED, not stroked. lucide draws every glyph as an outline,
     and a 2-unit outline is the first thing to vanish at 16px. The wedge is a
     closed path, so filling it costs nothing, and it is what peeq already did
     with the bare play triangle.
  2. Stroke is 2.5, not lucide's 2. At 16px a 2-unit frame washes out and a
     3.5-unit one closes the gap to the wedge; 2.5 keeps both readable. It is
     given in glyph units, so it scales with the glyph and stays proportional
     in the two tiled sources.

  Sized off the outer rect's TRUE bbox — x[3,21] y[3,21], grown by half the
  stroke to 20.5 square — not the nominal 24x24 box the paths only partly fill.
  Scaling by the box is what makes a glyph read as a dot at favicon sizes. Here
  it spans 96% of the tile, near enough edge to edge: a tab already sets the
  icon in padding of its own, so a margin inside the tile only shrinks the mark
  for nothing. The two tiled sources inset their glyph instead, because there
  the tile itself is visible. No optical nudge: unlike a bare triangle, the
  frame is symmetric, so its bbox centre is also its visual centre.

  THE FRAME IS FILLED, and that is not decoration. A frame is a closed shape,
  so the area it encloses is a surface the mark owns. Leaving it transparent
  hands that surface to whatever the client draws behind the icon: Safari's tab
  bar is light, so a hollow frame renders as a white box. peeq's own UI is dark,
  which is exactly why that went unseen — the interior picked up a dark chrome
  and looked deliberate. The fill is peeq's ground, the same #1f1f1e the two
  tiled sources and index.html's theme-color already use, so the icon reads the
  same on a light tab, a dark tab and a white bookmark card. The bare triangle
  this replaced needed no fill because a triangle encloses nothing.

  THE CANVAS CARRIES THAT SAME GROUND, edge to edge, and this file is NOT
  transparent. It used to be, on the reasoning that a browser composites the
  icon onto the tab and should be allowed to. Filling only the frame's interior
  left the four corners OUTSIDE its rounded silhouette still transparent, and
  those corners are not free: measured at 16px, the extreme corner pixel comes
  out pure #FFFFFF on a light tab bar with 96%-white tints beside it. Four
  corners of that is a set of pale notches on exactly the chrome the fill was
  meant to fix. A rounded shape cannot avoid this — anything outside the path
  is the client's to paint — so the ground goes under the whole 64x64 canvas
  instead, the way ui/icons/icon-tile.svg has always done it.

  The trade is deliberate: the silhouette is now a square rather than a rounded
  square. At 96% coverage the frame all but reaches the edge, so what the canvas
  adds is a corner sliver about one pixel wide at 16px. A square edge that
  matches peeq's ground beats a rounded one that leaks white.

  With no alpha left, all four rasters are opaque and hack/gen-icons.sh asserts
  exactly that — its icon-192/512 checks expect opaque=true. iOS and Android
  never see alpha here either, so nothing depends on the old flattening
  behaviour. apple-touch-icon.png and icon-maskable-512.png keep being rendered
  from the sources in ui/icons/ for their own reasons: square corners for the
  OS mask, and a smaller glyph. Regenerate the rasters with hack/gen-icons.sh
  after touching this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect width="64" height="64" fill="#1f1f1e"/>
  <g transform="translate(-3.965 -3.965) scale(2.9971)" fill="none" stroke="url(#og)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2" fill="#1f1f1e"/>
    <path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z" fill="url(#og)" stroke="none"/>
  </g>
</svg>
