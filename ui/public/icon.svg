<!--
  Peeq's icon: lucide's "square-play" — a play wedge inside a rounded frame,
  INVERTED. The chip is the ink and the wedge is cut out of it in peeq's own
  ground colour. A triangle alone at 16px is a shape with no outline to hold it;
  the chip gives it one, and being solid it holds it harder than a stroke did.

  THE CHIP IS THE INK. This file spent most of its history the other way round —
  a 2-unit orange stroke framing an orange wedge — and the reversal is the same
  one ../ismimodown made, for the same reason its tile.svg states: a stroked
  frame "put four thin marks in a 16px square, where the frame spent contrast
  the [glyph] needed. Filled, the silhouette is one solid object at any size,
  and the same object on every ground." Measured here on all three surfaces the
  mark actually lands on — peeq's own panel, Safari's rgb(192,192,192)
  favourites plate, and a dark tab strip — the hollow mark at 16px is a thin
  orange outline on each and the filled chip is a solid object on each.

  The paths are lucide's (ISC), copied rather than imported — nothing loads
  lucide-react to draw a static asset. Three departures from how lucide itself
  would render them:

  1. The wedge is FILLED, not stroked. lucide draws every glyph as an outline,
     and a 2-unit outline is the first thing to vanish at 16px. The wedge is a
     closed path, so filling it costs nothing.
  2. The frame is FILLED TOO, and carries no stroke at all — see above. Its
     corner is rx 4, not lucide's rx 2: a filled shape reads rounder than an
     outlined one at the same radius, and 4 is what the family uses. It also
     buys clearance in icon-maskable.svg, where the chip's corners are the only
     part near the safe circle.
  3. The wedge is SCALED 1.35 about the chip's centre. lucide sized it to sit
     inside a stroked frame, where the stroke ate the margin; on a filled chip
     that same wedge covers only 39% and the mark reads as an orange square with
     a speck in it. At 1.35 it covers about half. It is NOT scaled further: the
     wedge's own centre is x 12.45, not the chip's 12, so scaling about (12,12)
     walks it right — at 1.7 it visibly crowds the right edge. Anything past
     1.35 has to re-centre the wedge first, not just scale it.

  THE WEDGE IS PAINTED #1f1f1e (peeq's color-bg token), not knocked through the
  chip — an XML comment cannot carry the token's own two-dash prefix. A
  real knockout would let whatever is behind the icon show between chip and
  wedge, which on Safari's light plate means a hollow-looking mark; it has to
  stay dark-on-orange wherever the icon lands. #1f1f1e and not the #33322f the
  old separate favicon source used: that value existed because #1f1f1e "reads as
  a black square" at 16px, which is true of a full 16x16 ground and irrelevant
  for a small wedge sitting on bright ink.

  Sized off the chip's TRUE bbox — x[3,21] y[3,21], 18 square, centred on
  (12,12) — not the nominal 24x24 box the paths only partly fill. Scaling by the
  nominal box is what makes a glyph read as a dot at favicon sizes. Note the
  denominator is 18 and no longer 18+stroke: the chip is filled, so its drawn
  edge IS its geometric edge. Here it spans the canvas exactly, coverage 1.0 —
  the same silhouette size the stroked frame had, and flush with music's and
  mimostats' marks in the same tab bar, which is what 1.0 was chosen for. It was
  96% once, "near enough edge to edge" on the reasoning that a tab already sets
  the icon in padding of its own; near enough turned out to be visible, and peeq
  read as the smaller mark. The two tiled sources inset their glyph instead,
  because there the tile itself is visible. No optical nudge: unlike a bare
  triangle, the chip is symmetric, so its bbox centre is also its visual centre.

  THE TRANSFORMS ARE DERIVED, not typed:

    outer: scale = 64*C/18,  translate = 32 - 12*scale
    inner: scale = 1.35,     translate = 12*(1 - scale)

  where C is that file's coverage — 1.0 here, 0.60 in icon-tile.svg, 0.46 in
  icon-maskable.svg. Change the inner scale OR a coverage and every affected
  transform has to be recomputed, or the mark silently stops filling the
  coverage its own comment claims. music and mimostats carry the same formula;
  keep the three in step.

  TRANSPARENT CANVAS, not a transparent icon: the chip itself is opaque, and
  only the four corners outside its rx-4 radius are clear, so what lands in a
  tab is a chip rather than a square tile. That is enough for hack/gen-icons.sh's
  opaque=false assertion on icon-192/512, which this file renders.

  THIS FILE IS THE TAB ICON AGAIN. It shipped from a separate icon-favicon.svg
  for a while — this file with the frame's rect filled #33322f — because Safari
  draws favicons on a light rgb(192,192,192) plate in its favourites and
  bookmarks bars, where a transparent hollow mark lands as an orange scribble on
  a white card. A gradient-filled chip is a solid object on that plate already,
  so the separate source had nothing left to buy and is deleted. The reasoning
  is kept here rather than deleted with it: the plate is real and any future
  return to a hollow mark walks straight back into it.

  apple-touch-icon.png and icon-maskable-512.png stay opaque and are unaffected:
  they come from the separate tiled sources beside this file, which keep their
  grounds because iOS flattens alpha onto black and Android hands a transparent
  launcher icon whatever colour it likes.

  Mirror any shape change by hand into icon-tile.svg and icon-maskable.svg,
  which are copies and cannot follow on their own, and into SignInMark in
  ui/src/shell/SignIn.tsx, which draws the same geometry off CSS tokens.
  Regenerate the rasters with hack/gen-icons.sh after touching this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <g transform="translate(-10.6667 -10.6667) scale(3.55556)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(-4.2 -4.2) scale(1.35)" fill="#1f1f1e">
      <path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/>
    </g>
  </g>
</svg>
