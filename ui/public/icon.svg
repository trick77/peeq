<!--
  Peeq's icon: lucide's "square-play" — a play wedge inside a rounded frame.
  The rail keeps its bare triangle; this is the tab, and a triangle alone at
  16px is a shape with no outline to hold it. The frame gives it one.

  The paths are lucide's (ISC), copied rather than imported — nothing loads
  lucide-react to draw a static asset. Two departures from how lucide itself
  would render them:

  1. The wedge is FILLED, not stroked. lucide draws every glyph as an outline,
     and a 2-unit outline is the first thing to vanish at 16px. The wedge is a
     closed path, so filling it costs nothing, and it is what peeq already did
     with the bare play triangle.
  2. Stroke is 2.5, not lucide's 2. At 16px a 2-unit frame washes out and a
     3.5-unit one closes the gap to the wedge; 2.5 keeps both readable. It is
     given in glyph units, so it scales with the glyph and stays proportional
     in the two tiled sources.

  Sized off the outer rect's TRUE bbox — x[3,21] y[3,21], grown by half the
  stroke to 20.5 square — not the nominal 24x24 box the paths only partly fill.
  Scaling by the box is what makes a glyph read as a dot at favicon sizes. Here
  it spans 96% of the tile, near enough edge to edge: a tab already sets the
  icon in padding of its own, so a margin inside the tile only shrinks the mark
  for nothing. The two tiled sources below inset their glyph instead, because
  there the tile itself is visible. No optical nudge: unlike a bare triangle,
  the frame is symmetric, so its bbox centre is also its visual centre.

  Transparent ON PURPOSE, and only safe here: browsers composite this onto the
  tab. iOS and Android flatten alpha (onto black and onto the launcher's own
  fill), so apple-touch-icon.png and icon-maskable-512.png are rendered from the
  opaque sources in ui/icons/ instead. Regenerate the rasters with
  hack/gen-icons.sh after touching this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <g transform="translate(-3.965 -3.965) scale(2.9971)" fill="none" stroke="url(#og)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z" fill="url(#og)" stroke="none"/>
  </g>
</svg>
