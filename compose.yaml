# Production stack: single peeq service behind an external Traefik reverse
# proxy that terminates TLS. Requires an external "traefik" network
# (`docker network create traefik`) shared with your Traefik instance.
#
#   cp .env.example .env   # fill in the values, especially BACKEND_SESSION_SECRET
#                           # and the OIDC block
#   docker compose up -d
#
# The Traefik Host() rule below is set to peeq.trick77.com.
services:
  peeq:
    image: ghcr.io/trick77/peeq:latest
    restart: unless-stopped

    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # HOME/TMPDIR (set below) must be writable for yt-dlp's cookie temp
      # file + cache dir since the rootfs is read-only.
      - /tmp:size=256m

    environment:
      HOME: /tmp
      TMPDIR: /tmp
      BACKEND_ADDR: ":8080"
      BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL}"
      BACKEND_SESSION_SECRET: "${BACKEND_SESSION_SECRET}"
      BACKEND_AUTH_MODE: "${BACKEND_AUTH_MODE:-oidc}"
      BACKEND_OIDC_ISSUER: "${BACKEND_OIDC_ISSUER}"
      BACKEND_OIDC_CLIENT_ID: "${BACKEND_OIDC_CLIENT_ID}"
      BACKEND_OIDC_CLIENT_SECRET: "${BACKEND_OIDC_CLIENT_SECRET}"
      BACKEND_OIDC_REDIRECT_URL: "${BACKEND_OIDC_REDIRECT_URL}"
      BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL: "${BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL}"
      # Empty = no admin-group check (matches the code default); set to your IdP group to gate admin.
      BACKEND_OIDC_ADMIN_GROUP: "${BACKEND_OIDC_ADMIN_GROUP}"
      BACKEND_DB_PATH: /data/peeq.db
      BACKEND_MEDIA_DIR: /data/media
      BACKEND_YTDLP_DIR: /data/bin
      # AI endpoints. Values come from .env — see .env.example. Compose reads
      # .env for ${} interpolation only, so anything not listed here never
      # reaches the container.
      BACKEND_CHAT_BASE_URL: "${BACKEND_CHAT_BASE_URL}"
      BACKEND_CHAT_API_KEY: "${BACKEND_CHAT_API_KEY}"
      BACKEND_EMBED_BASE_URL: "${BACKEND_EMBED_BASE_URL}"
      BACKEND_EMBED_API_KEY: "${BACKEND_EMBED_API_KEY}"
      BACKEND_EMBED_MODEL: "${BACKEND_EMBED_MODEL}"
      # Must match the embedding model's real output dimension.
      BACKEND_EMBED_DIM: "${BACKEND_EMBED_DIM:-1536}"
      # How far a semantic hit may sit from the question before it counts as
      # "not about this" — L2 on unit vectors, so cosine is 1 - d²/2. Empty
      # keeps the code default; negative opts out of the bound entirely, which
      # is the way to see what the raw KNN ranking looks like.
      BACKEND_SEARCH_MAX_DISTANCE: "${BACKEND_SEARCH_MAX_DISTANCE:-}"
      BACKEND_DEFAULT_SUB_LANG: "${BACKEND_DEFAULT_SUB_LANG:-en}"
      BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-info}"
      # Timeouts and pacing. Empty keeps each one's code default.
      BACKEND_ASK_CALL_TIMEOUT: "${BACKEND_ASK_CALL_TIMEOUT:-}"
      BACKEND_CHAT_CALL_TIMEOUT: "${BACKEND_CHAT_CALL_TIMEOUT:-}"
      BACKEND_CHAT_STREAM_IDLE_TIMEOUT: "${BACKEND_CHAT_STREAM_IDLE_TIMEOUT:-}"
      BACKEND_SUMMARIZE_REQUEST_DELAY: "${BACKEND_SUMMARIZE_REQUEST_DELAY:-}"
      BACKEND_SUMMARIZE_VIDEO_DELAY: "${BACKEND_SUMMARIZE_VIDEO_DELAY:-}"
      BACKEND_SUMMARIZE_SUMMARY_TOKENS: "${BACKEND_SUMMARIZE_SUMMARY_TOKENS:-}"
      BACKEND_ALLOW_ANONYMOUS_YOUTUBE: "${BACKEND_ALLOW_ANONYMOUS_YOUTUBE:-}"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3

    volumes:
      - ./data:/data                 # SQLite DB (/data/peeq.db) + self-updating yt-dlp binary (/data/bin)
      - /mnt/ark/peeq:/data/media    # downloaded media on the dedicated volume

    networks:
      - traefik

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # Host rule for this deployment; change if the domain moves.
      traefik.http.routers.peeq.rule: Host(`peeq.trick77.com`)
      traefik.http.routers.peeq.entrypoints: websecure
      traefik.http.routers.peeq.tls: "true"
      traefik.http.services.peeq.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
