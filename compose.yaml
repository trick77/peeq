# Production stack: single vark service behind an external Traefik reverse
# proxy that terminates TLS. Requires an external "traefik" network
# (`docker network create traefik`) shared with your Traefik instance.
#
#   cp .env.example .env   # fill in the values, especially VARK_SESSION_SECRET
#                           # and the OIDC block
#   docker compose up -d
#
# Edit the Host() rule below to your real domain before deploying.
services:
  vark:
    image: ghcr.io/trick77/vark:latest
    restart: unless-stopped

    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # HOME/TMPDIR (set below) must be writable for yt-dlp's cookie temp
      # file + cache dir since the rootfs is read-only.
      - /tmp:size=256m

    environment:
      HOME: /tmp
      TMPDIR: /tmp
      VARK_ADDR: ":8080"
      VARK_PUBLIC_URL: "${VARK_PUBLIC_URL}"
      VARK_SESSION_SECRET: "${VARK_SESSION_SECRET}"
      VARK_AUTH_MODE: "${VARK_AUTH_MODE:-oidc}"
      VARK_OIDC_ISSUER: "${VARK_OIDC_ISSUER}"
      VARK_OIDC_CLIENT_ID: "${VARK_OIDC_CLIENT_ID}"
      VARK_OIDC_CLIENT_SECRET: "${VARK_OIDC_CLIENT_SECRET}"
      VARK_OIDC_REDIRECT_URL: "${VARK_OIDC_REDIRECT_URL}"
      VARK_OIDC_POST_LOGOUT_REDIRECT_URL: "${VARK_OIDC_POST_LOGOUT_REDIRECT_URL}"
      # Empty = no admin-group check (matches the code default); set to your IdP group to gate admin.
      VARK_OIDC_ADMIN_GROUP: "${VARK_OIDC_ADMIN_GROUP}"
      VARK_DB_PATH: /data/vark.db
      VARK_MEDIA_DIR: /data/media
      VARK_YTDLP_DIR: /data/bin
      VARK_LOG_LEVEL: "${VARK_LOG_LEVEL:-info}"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3

    volumes:
      - ./data:/data                 # SQLite DB (/data/vark.db) + self-updating yt-dlp binary (/data/bin)
      - /mnt/ark/peeq:/data/media    # downloaded media on the dedicated volume

    networks:
      - traefik

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # Replace the Host() rule with your real domain.
      traefik.http.routers.vark.rule: Host(`vark.example.com`)
      traefik.http.routers.vark.entrypoints: websecure
      traefik.http.routers.vark.tls: "true"
      traefik.http.services.vark.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
