# Production stack: single peeq service behind an external Traefik reverse
# proxy that terminates TLS. Requires an external "traefik" network
# (`docker network create traefik`) shared with your Traefik instance.
#
#   cp .env.example .env   # fill in the values, especially BACKEND_SESSION_SECRET
#                           # and the OIDC block
#   docker compose up -d
#
# The Traefik Host() rule below is set to peeq.trick77.com.
services:
  peeq:
    image: ghcr.io/trick77/peeq:latest
    restart: unless-stopped

    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # HOME/TMPDIR (set below) must be writable for yt-dlp's cookie temp
      # file + cache dir since the rootfs is read-only.
      - /tmp:size=256m

    # Every variable in .env reaches the container: BACKEND_* settings, the
    # model ids and whichever LLMWIRE_<PROVIDER>_API_KEY the models need — see
    # .env.example. Optional so the file still parses without one; peeq itself
    # refuses to boot on a missing required setting, naming it.
    env_file:
      - path: .env
        required: false
    # Only what this stack sets or defaults itself. These win over .env.
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      BACKEND_ADDR: ":8080"
      BACKEND_AUTH_MODE: "${BACKEND_AUTH_MODE:-oidc}"
      BACKEND_DB_PATH: /data/peeq.db
      BACKEND_MEDIA_DIR: /data/media
      BACKEND_YTDLP_DIR: /data/bin

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3

    volumes:
      - ./data:/data                 # SQLite DB (/data/peeq.db) + self-updating yt-dlp binary (/data/bin)
      - /mnt/ark/peeq:/data/media    # downloaded media on the dedicated volume

    networks:
      - traefik

    deploy:
      resources:
        limits:
          cpus: "2.0"
          # Sized for the PAGE CACHE, not for the Go heap.
          #
          # Under cgroup v2 the cache holding file pages this container reads is
          # charged against this limit, so the database and the heap compete for
          # one budget — and at 1g the database lost, every time. peeq.db is
          # ~200MB on 7200rpm platters; evicted, an Ask re-read the vector table
          # as ~11k random 4KB pages, which at the ~300 IOPS two spinning disks
          # manage is most of a minute.
          #
          # Measured on the same query, same build, cold then warm:
          #
          #   keyword search   36.2s -> 170ms
          #   vector search     7.7s -> 121ms
          #   merge             524ms ->  11ms
          #
          # The merge is the one that gives it away: it touches neither index,
          # only memory, and it moved 48x. Nothing was slow except the disk.
          #
          # 2g leaves the whole database resident with room for the heap. It is
          # what the host has spare, and it clears the requirement comfortably:
          # the rule of thumb is 2x the database plus a gigabyte for the runtime,
          # which at ~200MB is about 1.4g.
          #
          # THE NUMBER TRACKS THE DATABASE, NOT THE LIBRARY. Chunks are what grow
          # it — 7425 today. Once peeq.db approaches this limit the page cache
          # starts losing again and the minute-long Ask comes back, so revisit it
          # somewhere north of half a gigabyte on disk.
          #
          # The signal is free and already logged: `ask trace` prints every
          # stage's duration on every question. Local steps in milliseconds means
          # the database is resident; local steps in seconds means it is being
          # evicted and read off the platters again.
          memory: 2g

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # Host rule for this deployment; change if the domain moves.
      traefik.http.routers.peeq.rule: Host(`peeq.trick77.com`)
      traefik.http.routers.peeq.entrypoints: websecure
      traefik.http.routers.peeq.tls: "true"
      traefik.http.services.peeq.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
